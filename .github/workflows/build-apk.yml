name: Build APK

on:
  push:
    branches:
      - claude/mood-therapy-android-app-y0awhz
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Diagnostic: which secrets can this workflow actually see? Prints NAMES only --
  # the JSON blob stays in an env var and is never echoed, so no value can leak.
  list-secret-names:
    runs-on: ubuntu-latest
    steps:
      - name: Show available secret names
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import json, os
          try:
              names = sorted(json.loads(os.environ["SECRETS_JSON"]).keys())
          except Exception:
              print("could not parse secrets context")
              raise SystemExit(0)
          print("secrets visible to this workflow:")
          for n in names:
              print(f"  - {n}")
          expected = [
              "RELEASE_KEYSTORE_BASE64",
              "RELEASE_KEYSTORE_PASSWORD",
              "RELEASE_KEY_ALIAS",
              "RELEASE_KEY_PASSWORD",
          ]
          missing = [e for e in expected if e not in names]
          print("missing expected secrets:", missing if missing else "none")
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          fi

      - name: Build debug and release APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cbt-three-column-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish APKs as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "APK build ${{ github.run_number }}"
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
