name: Build APK

on:
  push:
    branches:
      - claude/mood-therapy-android-app-y0awhz
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          fi

      - name: Build debug and release APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cbt-three-column-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish APKs as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "APK build ${{ github.run_number }}"
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  explore-deploy-target:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect web server layout
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 13.213.15.169
          DEPLOY_USER: ubuntu
        run: |
          set -x
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" '
            echo "== whoami/sudo =="
            whoami
            sudo -n true 2>/dev/null && echo "HAS_PASSWORDLESS_SUDO" || echo "NO_PASSWORDLESS_SUDO"

            echo "== web server processes =="
            (sudo ss -ltnp 2>/dev/null || ss -ltnp) | grep -E ":(80|443)\b" || true

            echo "== nginx sites =="
            for f in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*.conf; do
              [ -f "$f" ] || continue
              echo "--- $f ---"
              sudo cat "$f" 2>/dev/null || cat "$f" 2>/dev/null
            done

            echo "== apache sites =="
            for f in /etc/apache2/sites-enabled/*; do
              [ -f "$f" ] || continue
              echo "--- $f ---"
              sudo cat "$f" 2>/dev/null || cat "$f" 2>/dev/null
            done

            echo "== common web roots =="
            for d in /var/www /var/www/html /srv/www /home/*/public_html /home/*/www; do
              [ -d "$d" ] || continue
              echo "--- $d ---"
              ls -la "$d" 2>/dev/null
            done

            echo "== searching for the page path on disk =="
            sudo find / -xdev -iname "*three-column-notebook*" -not -path "*/node_modules/*" 2>/dev/null | head -50
            echo "== searching for the site domain string in likely config/content dirs =="
            sudo grep -rIl "ztimelightspacestar" /etc/nginx /etc/apache2 /var/www /srv 2>/dev/null | head -50

            echo "== knowledge-site deploy layout =="
            ls -la /var/www/knowledge-site
            readlink -f /var/www/knowledge-site/current
            echo "== existing apk files on the site, if any =="
            find /var/www/knowledge-site -iname "*.apk" 2>/dev/null
            echo "== deploy tooling clues =="
            find / -maxdepth 6 -iname ".git" 2>/dev/null | grep -v "^/proc" || true
            ls -la /home/ubuntu 2>/dev/null
            cat /home/ubuntu/.bash_history 2>/dev/null | grep -iE "deploy|rsync|capistrano|git " | tail -30
            echo "== the current three-column-notebook page HTML =="
            cat "$(readlink -f /var/www/knowledge-site/current)/en/learn/psychology/three-column-notebook/index.html" 2>/dev/null | head -c 6000
          '

